[project]
name = "poll-forwarder"
version = "0.1.0"
description = "Telegram bot that forwards polls between chats"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Nils Kattenbeck", email = "nils.kattenbeck@simply-5.com" }]
dependencies = ["python-telegram-bot~=22.8"]

[project.optional-dependencies]
dev = ["mypy~=2.3", "ruff~=0.16"]

[project.scripts]
poll-forwarder = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["main.py"]
